<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<title>Register-Here!</title>
<style type="text/css">
ul { display: flex; list-style: none; margin: 0; padding: 0; }
.navbar_text { color: white; padding: 10px 15px; display: inline-block; text-decoration: none; }
.nav { background-color: blue; }
.spacer { flex: 1; }
nav.bar { background-color: blue; min-height: 40px; }
.frm:hover { background-color: #ECF3F0; }

</style>
</head>
<body>
<div style="background:#fff3cd;color:#664d03;text-align:center;padding:6px 10px;font-size:13px;font-family:sans-serif;">Static demo: nothing is saved. The full version runs on Java (JSP/Servlets) with MySQL.</div>
	<nav class="bar">
		<ul class="nav">
			<li><a class="navbar_text" href="index.html">Home</a></li>
			<li><a class="navbar_text" href="Login_Page.html">Login</a></li>
			<li class="spacer"></li>
			<li><a class="navbar_text" href="About_Us.html">About Us!</a></li>
		</ul>
	</nav>
	<div style="border-radius: 8px; border: 2px solid black; max-width: 520px; margin: 5% auto 0;">
		<div style="background-color: blue; border-radius: 5px; color: white; text-align: center;">REGISTER HERE!</div>
		<div style="padding: 5% 12%;" class="frm">
			<form onsubmit="event.preventDefault(); alert('Demo: registered (nothing is saved). Please log in.'); location.href='Login_Page.html';">
				Enter your Name : <br><input type="text" name="name" placeholder="Your Name" required style="width:100%"><br><br>
				Enter your Email : <br><input type="email" name="email" placeholder="Your E-mail" required style="width:100%"><br><br>
				Enter your Mobile Number : <br><input type="number" name="number" placeholder="Your Mobile Number" required style="width:100%"><br><br>
				Enter your Password : <br><input type="password" name="password" placeholder="Your Password" required style="width:100%"><br><br>
				<input style="background-color: #7C89FE; width: 100%; border-radius: 4px;" type="submit" value="Register"><br><br>
			</form>
			<a href="Login_Page.html">Click Here</a> to login if registered already!
		</div>
	</div>
</body>
</html>
